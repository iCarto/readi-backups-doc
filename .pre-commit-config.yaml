fail_fast: false
repos:
    # See https://pre-commit.com/hooks.html for more hooks

    - repo: "https://github.com/pre-commit/pre-commit-hooks"
      rev: v6.0.0
      hooks:
          - id: check-merge-conflict
          - id: check-added-large-files
            args:
                [--maxkb=1024]

                # - repo: https://github.com/astral-sh/ruff-pre-commit
                #   # Ruff version.
                #   rev: v0.14.14
                #   hooks:
                #       # Run the linter.
                #       - id: ruff-check
                #         args: [--fix]
                #         verbose: false
                #         priority: 20

                #       # Run the formatter.
                #       - id: ruff-format
                #         verbose: false
                #         priority: 10

    - repo: local
      hooks:
          - id: prettier
            name: prettier
            entry: npx prettier
            args: [--write, --ignore-path, .ignore]
            language: system
            types: [file]
            files: \.(js|jsx|ts|tsx|json|md|vue|yaml|yml)$ # html
            verbose: false
            priority: 10

          - id: "markdownlint-cli2"
            name: "markdownlint-cli2"
            entry: npx markdownlint-cli2
            language: system
            types: [markdown]
            verbose: false
            priority: 20

          - id: shfmt
            name: shfmt
            entry: shfmt
            args: [-l, -w]
            language: system
            types: [shell]
            verbose: false
            priority: 10

          - id: shellcheck
            name: shellcheck
            entry: shellcheck
            language: system
            types: [shell]
            verbose: false
            priority: 20
