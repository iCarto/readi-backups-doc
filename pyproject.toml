[project]
name = "readi-backups-doc"
version = "0.1.0"
description = "Guía base sobre copias de seguridad de iCarto."
readme = "README.md"
license = "CC-BY-4.0"
authors = [{ name = "iCarto", email = "dev@icarto.es" }]
classifiers = [
    "Private :: Do Not Upload",
]
requires-python = ">=3.12"
dependencies = [
    "mkdocs-material[imaging]==9.7.1",
]


[dependency-groups]
dev = [
    "ruff==0.14.14",
    "prek==0.3.0",
    "python-frontmatter==1.1.0",
]


[tool.uv]
package = false
exclude-newer = "7 days"
